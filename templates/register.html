{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-14">
  <div class="bg-white border border-slate-200 rounded-xl p-8">
    <h1 class="text-2xl font-bold">Create an account</h1>
    <p class="text-sm text-slate-500 mt-1 mb-6">Choose the option that describes you.</p>
    <form method="post" class="flex flex-col gap-4 text-sm">
      <label><span class="font-semibold">Full name</span>
        <input name="name" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5"></label>
      <label><span class="font-semibold">Email</span>
        <input type="email" name="email" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5"></label>
      <label><span class="font-semibold">Password</span>
        <input type="password" name="password" required minlength="6" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5"></label>
      <fieldset>
        <legend class="font-semibold mb-2">I am registering as</legend>
        <div class="grid grid-cols-2 gap-3">
          <label class="border border-slate-300 rounded-lg p-4 cursor-pointer has-[:checked]:border-brand-blue has-[:checked]:bg-blue-50">
            <input type="radio" name="role" value="investor" checked class="mr-2">Investor
            <span class="block text-xs text-slate-500 mt-1">Browse and save startups, message founders.</span></label>
          <label class="border border-slate-300 rounded-lg p-4 cursor-pointer has-[:checked]:border-brand-blue has-[:checked]:bg-blue-50">
            <input type="radio" name="role" value="founder" class="mr-2">Startup founder
            <span class="block text-xs text-slate-500 mt-1">Register your company, upload documents and list products.</span></label>
        </div>
      </fieldset>
      <button class="bg-brand-blue text-white font-semibold rounded-lg py-2.5 hover:bg-blue-700">Create account</button>
    </form>
    <p class="text-sm text-slate-500 mt-5 text-center">Already registered? <a href="{{ url_for('auth.login') }}" class="text-brand-blue font-semibold">Log in</a></p>
  </div>
</div>
{% endblock %}
